[project]
name = "tact-downloader"
version = "0.1.0"
description = "名古屋大学 TACT から講義リソースをダウンロードするCLIツール"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40.0",
  "pyotp>=2.9.0",
  "python-dotenv>=0.21.0",
  "requests>=2.28.0",
]

[dependency-groups]
dev = ["pre-commit", "pyright", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["main.py", "tact_downloader", "scripts", "tests"]
exclude = [".venv", "node_modules", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]

[tool.coverage.run]
branch = true
source = ["tact_downloader", "main"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
